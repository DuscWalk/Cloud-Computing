# Bootstrap only: install before requesting the first IP certificate.
# Replace with ip-https.conf after issuance succeeds.
server {
    listen 80;
    server_name 120.46.147.216;
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/acme;
        default_type text/plain;
        try_files $uri =404;
    }
    location / {
        return 503;
    }
}
