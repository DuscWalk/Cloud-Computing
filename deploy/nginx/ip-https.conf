# Trusted IP certificate, issued with certbot's shortlived ACME profile.
# Keep the HTTP challenge reachable so renewal works without stopping Nginx.
server {
    listen 80;
    server_name 120.46.147.216;
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/acme;
        default_type text/plain;
        try_files $uri =404;
    }
    location / {
        return 308 https://120.46.147.216$request_uri;
    }
}

server {
    listen 443 ssl;
    server_name 120.46.147.216;
    ssl_certificate /etc/letsencrypt/live/nju-attendance-ip/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/nju-attendance-ip/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    client_max_body_size 6m;
    add_header Strict-Transport-Security "max-age=86400" always;
    location / {
        proxy_pass http://127.0.0.1:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
    }
}
