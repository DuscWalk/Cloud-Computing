name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: '0.12.17'
          python-version: '3.12'
      - run: uv sync --project backend --frozen
      - run: uv run --project backend ruff check backend
      - run: uv run --project backend ruff format --check backend
      - run: uv run pytest -q
        working-directory: backend
      - name: Verify migrations and schema drift
        working-directory: backend
        run: |
          mkdir -p data
          uv run alembic upgrade head
          uv run alembic check
          uv run alembic downgrade base
          uv run alembic upgrade head

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
        working-directory: frontend
      - run: npm run build
        working-directory: frontend

  models:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: '0.12.17'
          python-version: '3.12'
      - uses: actions/cache@v4
        with:
          path: backend/models/*.onnx
          key: opencv-zoo-47534e27c9851bb1128ccc0102f1145e27f23f98
      - run: uv sync --project backend --frozen
      - run: uv run python -m app.model_assets
        working-directory: backend
      - run: uv run pytest -q -s tests/test_models.py
        working-directory: backend
        env:
          RUN_MODEL_TESTS: '1'

  integration:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      MYSQL_PASSWORD: ci-app-password
      MYSQL_ROOT_PASSWORD: ci-root-password
      APP_SECRET_KEY: ci-only-secret-key-not-used-in-production
      E2E_ADMIN_USERNAME: ci_admin
      E2E_ADMIN_PASSWORD: ci-only-admin-password-2026
      COMPOSE_BAKE: 'false'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
        working-directory: frontend
      - run: npx playwright install --with-deps chromium
        working-directory: frontend
      - name: Start database, queue, CPU Worker, API and web
        id: stack
        run: |
          mkdir -p frontend/runtime-evidence
          set -o pipefail
          docker compose up --build -d --wait --wait-timeout 300 2>&1 | tee frontend/runtime-evidence/startup.log
      - name: Annotate startup failures
        if: failure() && steps.stack.outcome == 'failure'
        run: |
          python3 - <<'PY'
          from pathlib import Path
          detail = Path('frontend/runtime-evidence/startup.log').read_text()[-6000:]
          detail = detail.replace('%', '%25').replace('\r', '%0D').replace('\n', '%0A')
          print(f'::error title=Container startup failed::{detail}')
          PY
      - name: Provision isolated CI administrator
        run: printf '%s\n' "$E2E_ADMIN_PASSWORD" | docker compose exec -T api python -m app.admin create-admin "$E2E_ADMIN_USERNAME" --password-stdin
      - name: Exercise attendance and capture resource samples
        run: |
          mkdir -p runtime-evidence
          docker stats --format '{{json .}}' > runtime-evidence/container-stats.jsonl &
          stats_pid=$!
          trap 'kill "$stats_pid" 2>/dev/null || true' EXIT
          npm run test:e2e
        working-directory: frontend
        env:
          E2E_BASE_URL: http://127.0.0.1:8080
          E2E_DATABASE_EVIDENCE: compose
      - name: Container logs
        if: always()
        run: |
          mkdir -p frontend/runtime-evidence
          docker compose logs --no-color api migrate model-init worker dispatcher web > frontend/runtime-evidence/containers.log
          cat frontend/runtime-evidence/containers.log
      - name: Save screenshots and browser report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: iteration-three-evidence
          path: |
            frontend/test-results
            frontend/playwright-report
            frontend/runtime-evidence
          retention-days: 7

  publish:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [backend, frontend, models, integration]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: backend
          push: true
          tags: ghcr.io/duscwalk/cloud-computing-api:${{ github.sha }}
          cache-from: type=gha,scope=attendance-api
          cache-to: type=gha,mode=max,scope=attendance-api
      - uses: docker/build-push-action@v6
        with:
          context: frontend
          push: true
          tags: ghcr.io/duscwalk/cloud-computing-web:${{ github.sha }}
          cache-from: type=gha,scope=attendance-web
          cache-to: type=gha,mode=max,scope=attendance-web
