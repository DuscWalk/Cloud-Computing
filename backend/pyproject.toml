[project]
name = "nju-face-attendance"
version = "0.2.0"
requires-python = ">=3.10"
dependencies = [
  "fastapi>=0.115,<0.116", "uvicorn[standard]>=0.34,<1",
  "sqlalchemy>=2.0,<2.1", "alembic>=1.14,<2", "pymysql[rsa]>=1.1,<2",
  "pydantic-settings>=2.7,<3", "python-multipart>=0.0.20,<1",
  "argon2-cffi>=23.1,<26", "itsdangerous>=2.2,<3",
  "pillow>=11.1,<13", "redis>=5.2,<7",
]

[dependency-groups]
dev = ["pytest>=8.3,<10", "httpx>=0.28,<1", "ruff>=0.11,<1"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["B008"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
